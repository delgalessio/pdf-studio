<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>(function(){try{var t=localStorage.getItem("pdfstudio-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}})()</script>
<title>PDF Studio</title>
<style>
:root{color-scheme:light;
  --ink:#171a33;--mute:#5d6485;--faint:#8b92b0;
  --acc:#5b5bf0;--acc2:#8b5cf6;--acc-glow:rgba(91,91,240,.34);--acc-soft:rgba(91,91,240,.12);--warn:#d6455d;
  --glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.78);--in:rgba(255,255,255,.62);
  --edge:rgba(255,255,255,.85);--hair:rgba(70,80,150,.16);--gap:#fff;
  --sh1:0 1px 1px rgba(40,50,110,.05),0 8px 26px rgba(40,50,110,.10);
  --sh2:0 2px 6px rgba(40,50,110,.08),0 26px 64px rgba(40,50,110,.22);
  --blur:blur(22px) saturate(170%);--desk:rgba(105,115,180,.16);--tip:rgba(23,26,51,.92);--kbd:#fff;
  --bg1:#eef0ff;--bg2:#f7f0ff;--bg3:#e6f8ff;--b1:#bcc6ff;--b2:#f6c4e8;--b3:#98e6f4;
  --chrome:var(--glass2);--chrome2:var(--in);--line:var(--hair);--work:var(--desk);--acc-d:var(--acc2);
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.5,.5,1);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",Inter,Roboto,system-ui,sans-serif;color:var(--ink)}
:root[data-theme="dark"]{color-scheme:dark;
  --ink:#eef0ff;--mute:#a7aed4;--faint:#767da6;--acc:#7b7bff;--acc2:#a37bff;--acc-glow:rgba(123,123,255,.45);--acc-soft:rgba(123,123,255,.2);--warn:#ff6b85;
  --glass:rgba(30,33,66,.55);--glass2:rgba(52,56,104,.70);--in:rgba(255,255,255,.07);--edge:rgba(255,255,255,.15);--hair:rgba(255,255,255,.14);--gap:#2b2f5e;
  --sh1:0 1px 1px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.38);--sh2:0 2px 6px rgba(0,0,0,.3),0 30px 80px rgba(0,0,0,.55);
  --desk:rgba(0,0,0,.28);--tip:rgba(8,10,28,.95);--kbd:rgba(255,255,255,.14);
  --bg1:#0c0e24;--bg2:#15102e;--bg3:#07202c;--b1:#35399c;--b2:#6b2a70;--b3:#0b6179}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(155deg,var(--bg1),var(--bg2) 52%,var(--bg3))}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(40px);opacity:.9;
  background:radial-gradient(38% 34% at 14% 16%,var(--b1),transparent 70%),radial-gradient(34% 38% at 88% 10%,var(--b2),transparent 70%),radial-gradient(44% 38% at 68% 96%,var(--b3),transparent 70%);
  animation:drift 32s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.1)}}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
*{scrollbar-width:thin;scrollbar-color:var(--hair) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--hair);border-radius:10px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:content-box;border:2px solid transparent}

/* ---- struttura ---- */
.app{position:relative;z-index:0;height:100%;display:grid;gap:10px;padding:10px;grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-columns:64px auto minmax(0,1fr)}
.app.nopanel{grid-template-columns:64px minmax(0,1fr)}
.center{display:contents}
.top{grid-column:1/-1;grid-row:1}
.tools{grid-column:1;grid-row:2/5}
.panel{grid-column:2;grid-row:2/4}
.bar{grid-column:3;grid-row:2}
.work{grid-column:3;grid-row:3}
.legend{grid-column:2/-1;grid-row:4}
.status{grid-column:1/-1;grid-row:5}
.app.nopanel .bar,.app.nopanel .work{grid-column:2}
.top,.tools,.panel,.bar,.legend,.status,.dlgbox,.drop,.zone,.loading>div{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge);box-shadow:var(--sh1),inset 0 1px 0 rgba(255,255,255,.35)}

/* ---- barra superiore ---- */
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:20px}
.grp{display:flex;gap:6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:15px;margin-right:6px;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:10px;display:block;position:relative;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 16px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.5)}
.logo i::after{content:"";position:absolute;left:9px;top:7px;width:12px;height:16px;background:#fff;opacity:.95;border-radius:2px;clip-path:polygon(0 0,66% 0,100% 24%,100% 100%,0 100%)}
.docname{flex:1;min-width:0;text-align:center;color:var(--mute);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 14px;border-radius:999px;background:var(--in);border:1px solid var(--hair)}

/* ---- pulsanti ---- */
.btn{height:36px;padding:0 14px;border-radius:12px;border:1px solid var(--edge);background:var(--glass2);color:var(--ink);font-weight:550;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;
  box-shadow:0 1px 2px rgba(40,50,110,.10),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s,border-color .2s,filter .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 20px rgba(40,50,110,.16),inset 0 1px 0 rgba(255,255,255,.5);border-color:var(--acc-soft)}
.btn:active:not(:disabled){transform:translateY(0) scale(.97);box-shadow:0 1px 2px rgba(40,50,110,.12)}
.btn:focus-visible,.tool:focus-visible,.tile:focus-visible{outline:none;box-shadow:0 0 0 3px var(--acc-glow)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{color:#fff;border-color:rgba(255,255,255,.4);background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 20px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08) saturate(1.1);box-shadow:0 12px 28px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.big{height:44px;padding:0 24px;border-radius:14px;font-size:14.5px}
.icon-btn{width:36px;padding:0}
.btn svg,.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}

/* ---- barra degli strumenti ---- */
.tools{border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;position:relative;z-index:3}
.tool{width:44px;height:44px;border-radius:14px;border:1px solid transparent;background:transparent;color:var(--mute);display:grid;place-items:center;cursor:pointer;position:relative;flex:none;
  transition:transform .22s var(--spring),background .2s,color .2s,box-shadow .25s}
.tool svg{width:21px;height:21px}
.tool:hover{background:var(--glass2);color:var(--ink);transform:scale(1.08);box-shadow:0 6px 16px rgba(40,50,110,.14)}
.tool:active{transform:scale(.94)}
.tool.on{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:rgba(255,255,255,.35);box-shadow:0 10px 24px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.45)}
.tool::after{content:attr(data-tip);position:absolute;left:calc(100% + 16px);top:50%;transform:translate(-6px,-50%);opacity:0;pointer-events:none;white-space:nowrap;background:var(--tip);color:#fff;padding:6px 11px;border-radius:10px;font-size:12px;font-weight:500;box-shadow:var(--sh1);transition:opacity .15s,transform .2s var(--ease);z-index:30}
.tool:hover::after{opacity:1;transform:translate(0,-50%);transition-delay:.25s}

/* ---- pannello delle proprietà (con freccia verso lo strumento) ---- */
.panel{position:relative;z-index:2;width:292px;border-radius:22px;display:flex;flex-direction:column;min-height:0}
.panel.closed{display:none}
.panel::before,.panel::after{content:"";position:absolute;pointer-events:none;clip-path:polygon(100% 0,0 50%,100% 100%)}
.panel::before{left:-12px;width:12px;height:22px;top:calc(var(--tab-y,30px) - 11px);background:var(--edge)}
.panel::after{left:-10.5px;width:12px;height:20px;top:calc(var(--tab-y,30px) - 10px);background:var(--glass2);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.panel.emerge{animation:emerge .34s var(--ease);transform-origin:0 var(--tab-y,30px)}
@keyframes emerge{from{opacity:0;transform:translateX(-16px) scale(.96)}to{opacity:1;transform:none}}
#props{flex:1;min-height:0;overflow:auto;padding:6px 0 12px;border-radius:inherit}
#props h2{margin:0;padding:14px 20px 8px;font-size:15px;font-weight:700;letter-spacing:-.01em}
#props p{margin:0;padding:2px 20px 14px;font-size:12.5px;color:var(--mute);line-height:1.55}
.form{display:grid;gap:12px;padding:8px 20px 14px}
.row{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.row.stack{grid-template-columns:1fr;gap:8px}
.row input,.row select,.row textarea,.bar input[type=number],.dlgrange input,.fmt select,.fmt input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--in);border:1px solid var(--hair);border-radius:11px;padding:8px 11px;transition:border-color .2s,box-shadow .2s,background .2s}
.row input:hover,.row select:hover,.row textarea:hover{border-color:var(--faint)}
.row input:focus,.row select:focus,.row textarea:focus,.bar input:focus,.dlgrange input:focus,.fmt select:focus,.fmt input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow);background:var(--glass2)}
.row input[type=checkbox]{-webkit-appearance:none;appearance:none;width:24px;height:24px;padding:0;border-radius:8px;justify-self:start;cursor:pointer;display:grid;place-items:center;transition:background .2s,transform .2s var(--spring),border-color .2s}
.row input[type=checkbox]::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .2s var(--spring)}
.row input[type=checkbox]:checked{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;box-shadow:0 4px 12px var(--acc-glow)}
.row input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
.row input[type=checkbox]:active{transform:scale(.9)}
.row textarea{resize:vertical;min-height:60px}
.form>.btn{width:100%}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 6px;justify-items:start}
.pal button,.pal .cust{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.2);padding:0;cursor:pointer;position:relative;display:block;box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 2px 5px rgba(0,0,0,.18);transition:transform .2s var(--spring),box-shadow .2s}
.pal button:hover,.pal .cust:hover{transform:scale(1.2)}
.pal button[aria-pressed=true],.pal .cust.on{box-shadow:0 0 0 2px var(--gap),0 0 0 4px var(--acc),0 4px 10px var(--acc-glow)}
.pal .cust{background:conic-gradient(#d62828,#f7c600,#2e9e4f,#0f9fc7,#2457c5,#7b3fbf,#d62828)}
.pal .cust input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--in);border:1px solid var(--hair)}
.modes .btn{height:32px;padding:0 2px;font-size:12px;border:0;background:transparent;box-shadow:none;border-radius:10px;color:var(--mute)}
.modes .btn:hover:not(:disabled){transform:none;box-shadow:none;background:var(--glass2)}
.modes .btn.primary{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 14px var(--acc-glow)}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.layers .btn{height:34px;justify-content:center;padding:0 8px;font-size:12.5px}
.fmt{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 12px}
.fmt select{flex:1 0 100%;height:36px}
.fmt input[type=number]{width:68px;height:36px}

/* ---- barra pagina e zoom ---- */
.bar{display:flex;align-items:center;gap:8px;padding:7px 12px;flex-wrap:wrap;border-radius:18px}
.bar input[type=number]{width:60px;height:36px;text-align:center;padding:0 6px}
.zoomval{min-width:56px;text-align:center;font-variant-numeric:tabular-nums;font-weight:650}

/* ---- area di lavoro e pagina ---- */
.work{overflow:auto;position:relative;border-radius:22px;background:var(--desk);border:1px solid var(--edge);box-shadow:inset 0 3px 18px rgba(40,50,110,.12)}
.sheet{position:relative;width:max-content;margin:28px auto;background:#fff;border-radius:3px;box-shadow:0 2px 4px rgba(30,40,100,.10),0 24px 60px rgba(30,40,100,.26),0 0 0 1px rgba(30,40,100,.06);animation:rise .5s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.sheet canvas{display:block}
.sheet svg{position:absolute;left:0;top:0}

/* ---- schermata iniziale ---- */
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.drop{max-width:460px;text-align:center;padding:44px 40px 38px;border-radius:30px;box-shadow:var(--sh2);transition:transform .3s var(--ease)}
.drop:hover{transform:translateY(-3px)}
.drop-ico{width:76px;height:76px;margin:0 auto 20px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 18px 40px var(--acc-glow),inset 0 1px 0 rgba(255,255,255,.5);animation:float 4.5s ease-in-out infinite}
.drop-ico svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.drop h1{font-size:23px;margin:0 0 8px;letter-spacing:-.02em;background:linear-gradient(135deg,var(--ink) 30%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.drop p{margin:0 0 24px;color:var(--mute);line-height:1.55;font-size:14px}

/* ---- trascinamento dei file ---- */
.veil{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(40,45,120,.22);-webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%);opacity:0;pointer-events:none;transition:opacity .22s}
.veil.on{opacity:1;pointer-events:auto}
.vframe{position:absolute;inset:16px;border-radius:30px;border:2px dashed rgba(255,255,255,.9);box-shadow:0 0 0 1px var(--acc),0 0 50px var(--acc-glow),inset 0 0 50px var(--acc-glow);animation:pulse 1.7s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.004)}}
.zones{position:relative;display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.zone{width:min(320px,42vw);min-width:230px;padding:34px 26px;border-radius:28px;text-align:center;background:var(--glass2);box-shadow:var(--sh2);transform:scale(.96);transition:transform .25s var(--spring),background .25s,box-shadow .25s,color .2s;animation:rise .35s var(--ease)}
.zone svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px}
.zone h3{margin:0 0 6px;font-size:17px;letter-spacing:-.01em}
.zone p{margin:0;font-size:13px;opacity:.75}
.zone.hot{transform:scale(1.06);color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 26px 70px var(--acc-glow)}

/* ---- legenda e barra di stato ---- */
.legend{min-width:0;overflow:hidden;font-size:12.5px;padding:7px 14px;border-radius:16px}
.legend.mini{padding:5px 8px}
.legend .lh{display:flex;align-items:center;gap:8px;font-weight:650;margin-bottom:6px}
.legend.mini .lh{margin:0}
.legend .lh .btn{height:30px;width:30px;padding:0;flex:none;border-radius:10px}
.legend.mini .lh .btn{width:auto;padding:0 12px;font-weight:500;color:var(--mute)}
.legend .cols{display:grid;grid-template-columns:1fr 1fr;gap:5px 26px}
.legend dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 10px;margin:0;align-items:baseline;min-width:0;align-content:start}
.legend dd{margin:0;color:var(--mute)}
.legend kbd{font:inherit;font-size:11.5px;background:var(--kbd);border:1px solid var(--hair);border-bottom-width:2px;border-radius:7px;padding:1px 8px;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.7) inset}
@media (max-width:700px){.legend .cols{grid-template-columns:1fr}}
.status{display:flex;align-items:center;gap:22px;padding:7px 18px;border-radius:14px;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden}
.status b{color:var(--ink);font-weight:650}
.status span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}

/* ---- finestra di gestione delle pagine ---- */
.dlg{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(30,35,90,.30);-webkit-backdrop-filter:blur(14px) saturate(130%);backdrop-filter:blur(14px) saturate(130%);animation:fade .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlgbox{width:min(1020px,100%);max-height:92vh;border-radius:28px;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;overflow:hidden;background:var(--glass2);box-shadow:var(--sh2);animation:pop .32s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.dlghead{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--hair)}
.dlghead h2{margin:0;font-size:17px;letter-spacing:-.01em}
.dlgtools,.dlgrange{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 22px;border-bottom:1px solid var(--hair)}
.dlgrange label{font-size:13px;color:var(--mute)}
.dlgrange input{flex:1 1 240px;height:36px}
.thumbs{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:16px;padding:20px 22px;align-content:start;background:var(--desk)}
.tile{background:var(--glass2);border:1.5px solid var(--edge);border-radius:18px;padding:10px;display:grid;gap:8px;justify-items:center;cursor:pointer;position:relative;user-select:none;box-shadow:var(--sh1);transition:transform .22s var(--ease),box-shadow .22s,border-color .2s}
.tile:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.tile img{max-width:100%;max-height:200px;background:#fff;border-radius:4px;box-shadow:0 2px 8px rgba(30,40,100,.22);min-height:60px;min-width:60px;animation:fade .4s}
.tile.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-glow),var(--sh2)}
.tile.cur .lab::after{content:" (aperta)";color:var(--acc);font-weight:600}
.tile.db{box-shadow:-7px 0 0 var(--acc),var(--sh1)}.tile.da{box-shadow:7px 0 0 var(--acc),var(--sh1)}
.tile .lab{font-size:12.5px;text-align:center;overflow-wrap:anywhere;color:var(--mute)}
.tile .bd{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:999px;font-size:11px;font-weight:600;padding:2px 9px;box-shadow:0 4px 10px var(--acc-glow)}
.dlgfoot{padding:12px 22px;border-top:1px solid var(--hair);font-size:13px;color:var(--mute);line-height:1.5}
.dlgfoot b{color:var(--warn)}

/* ---- messaggi e caricamento ---- */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,24px) scale(.96);opacity:0;pointer-events:none;max-width:min(580px,92vw);padding:13px 20px;border-radius:18px;background:rgba(24,27,60,.86);color:#fff;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.16);box-shadow:var(--sh2);font-size:14px;line-height:1.45;z-index:70;transition:opacity .25s,transform .35s var(--spring)}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.err{background:rgba(180,35,65,.9)}
.loading{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(225,228,255,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .2s}
:root[data-theme="dark"] .loading{background:rgba(5,6,20,.4)}
.loading.on{opacity:1;pointer-events:auto}
.loading>div{border-radius:20px;padding:18px 24px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh2);background:var(--glass2)}
.spin{width:22px;height:22px;border:3px solid var(--hair);border-top-color:var(--acc);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:760px){.panel{position:fixed;left:84px;top:84px;bottom:90px;z-index:10;margin:0}.panel::before,.panel::after{display:none}}
.rng{display:block}
.rng input[type=range],.rng input[type=range]:hover,.rng input[type=range]:focus{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;cursor:pointer}
.rng input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--acc) var(--p,50%),var(--hair) var(--p,50%))}
.rng input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 3px 9px var(--acc-glow);transition:transform .18s var(--spring),box-shadow .2s}
.rng input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15)}
.rng input[type=range]:active::-webkit-slider-thumb{transform:scale(.94);box-shadow:0 0 0 6px var(--acc-soft),0 3px 9px var(--acc-glow)}
.rng input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--acc-glow)}
.rng input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--hair)}
.rng input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--acc)}
.rng input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 3px 9px var(--acc-glow)}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rhead output{font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink);background:var(--in);border:1px solid var(--hair);border-radius:9px;padding:2px 10px;font-size:12px}
.seg{display:flex;gap:3px;padding:3px;border-radius:13px;background:var(--in);border:1px solid var(--hair)}
.seg button{flex:1;min-width:36px;height:34px;border:0;background:transparent;color:var(--mute);border-radius:10px;cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s,transform .22s var(--spring),box-shadow .2s}
.seg button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg button:hover{background:var(--glass2);color:var(--ink);transform:translateY(-1px)}
.seg button.on{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 14px var(--acc-glow)}
.seg button:active{transform:scale(.93)}
.seg button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--acc-glow)}
.flab{flex:1 0 100%;font-size:13px;color:var(--mute);margin-top:4px}
.segs{display:flex;gap:10px}.segs .seg{flex:1}
.notrans *,.notrans *::before,.notrans *::after{transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>
"use strict";
/* ===== Stato del documento: indipendente dal rendering =====
   Gli elementi (Fase 2+) useranno coordinate in PUNTI PDF riferite alla pagina
   come appare (rotazione inclusa), mai pixel dello schermo. */
const S = {
  name: "", pdf: null, numPages: 0,
  page: 1, zoom: 1,
  pageSize: null,            // {w,h} in punti, dopo la rotazione della pagina
  pageInfo: {},              // numero pagina -> {w,h,rot}
  elements: [],              // {id,type,page,x,y,w,h,rot,props}
  dirty: false,
  panelOpen: true,
  token: 0, task: null
};
const MIN_Z = 0.25, MAX_Z = 4;
const $ = id => document.getElementById(id);

function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg; t.className = "toast on" + (isErr ? " err" : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = "toast", isErr ? 7000 : 3000);

function setLoading(on, txt) { $("loading").classList.toggle("on", on); if (txt) $("loadTxt").textContent = txt; }

/* ===== Apertura ===== */
async function openFile(file) {

  if (S.dirty && !confirm("Ci sono modifiche non salvate. Vuoi aprire un altro documento e perderle?")) return;
  if (typeof pdfjsLib === "undefined") { toast("Libreria PDF.js non caricata. Controlla la connessione a internet e ricarica la pagina.", true); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  setLoading(true, "Apertura di " + file.name + "…");
  let newPdf = null;
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    newPdf = await pdfjsLib.getDocument({ data: bytes.slice() }).promise; S.pendingBytes = bytes;
  } catch (e) {
    setLoading(false);
    const n = e && e.name;
    if (n === "PasswordException") toast("Il PDF è protetto da password: questa versione non può aprirlo.", true);
    else if (n === "InvalidPDFException") toast("Il file non è un PDF valido o è danneggiato.", true);
    else toast("Impossibile aprire il PDF: " + (e && e.message ? e.message : "errore sconosciuto"), true);
    return;           // il documento precedente resta aperto e intatto
  }
  releaseDocument();  // pulizia delle risorse del documento precedente
  S.sources = [{ name: file.name, bytes: S.pendingBytes, pdf: newPdf, hasForm: false }]; S.pdf = newPdf; S.bytes = S.pendingBytes; S.name = file.name;
  S.pages = Array.from({ length: newPdf.numPages }, (_, i) => ({ id: nextPid++, src: 0, n: i + 1 })); S.numPages = S.pages.length; S.thumbs = {}; closePages();
  try { S.sources[0].hasForm = !!(await newPdf.getFieldObjects()); } catch (e) {}
  S.page = 1; S.pageInfo = {}; S.elements = []; S.dirty = false;
  Object.values(S.assets || {}).forEach(a => URL.revokeObjectURL(a.url)); S.assets = {};
  S.hist = []; S.fut = []; S.sel = null; S.clip = null; renderProps();
  $("empty").hidden = true; $("sheet").hidden = false;
  try {
    await fitWidth(false);
    await render();
  } catch (e) { toast("Errore nel disegno della pagina: " + e.message, true); }
  setLoading(false);
  updateUI();
}
function releaseDocument() {
  S.token++;
  if (S.task) { try { S.task.cancel(); } catch (e) {} S.task = null; }
  (S.sources || []).forEach(x => { try { x.pdf.destroy(); } catch (e) {} }); S.sources = []; S.pdf = null;
}

/* ===== Rendering della sola pagina: non tocca stato, pannello o toolbar ===== */
async function pageSize(n) {
  const pg = S.pages[n - 1], key = pkey(pg); if (S.pageInfo[key]) return S.pageInfo[key];
  const p = await S.sources[pg.src].pdf.getPage(pg.n), tot = ((p.rotate || 0) + (pg.rot || 0)) % 360;
  const v = p.getViewport({ scale: 1, rotation: tot });   // include la rotazione della pagina
  return (S.pageInfo[key] = { w: v.width, h: v.height, rot: tot });
}
async function render() {
  if (!S.pdf) return;
  if (S.editing) endEdit();
  const tok = ++S.token;
  if (S.task) { try { S.task.cancel(); } catch (e) {} }
  const cur = S.pages[S.page - 1], page = await S.sources[cur.src].pdf.getPage(cur.n), tot = ((page.rotate || 0) + (cur.rot || 0)) % 360;
  if (tok !== S.token) return;
  const base = page.getViewport({ scale: 1, rotation: tot });
  S.pageSize = { w: base.width, h: base.height };
  S.pageInfo[pkey(cur)] = { w: base.width, h: base.height, rot: tot };
  const vp = page.getViewport({ scale: S.zoom, rotation: tot });
  let ratio = window.devicePixelRatio || 1;
  const px = vp.width * ratio * vp.height * ratio;
  if (px > 16e6) ratio *= Math.sqrt(16e6 / px);       // limite di memoria del canvas
  const off = document.createElement("canvas");
  off.width = Math.max(1, Math.floor(vp.width * ratio));
  off.height = Math.max(1, Math.floor(vp.height * ratio));
  const task = page.render({ canvasContext: off.getContext("2d"), viewport: vp, transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null });
  S.task = task;
  try { await task.promise; }
  catch (e) { if (e && e.name === "RenderingCancelledException") return; throw e; }
  if (tok !== S.token) return;
  const c = $("pdfCanvas");
  c.width = off.width; c.height = off.height;
  c.style.width = vp.width + "px"; c.style.height = vp.height + "px";
  c.getContext("2d").drawImage(off, 0, 0);
  // Overlay: lo spazio interno è in punti PDF, la dimensione a schermo segue lo zoom
  const ov = $("overlay");
  ov.setAttribute("viewBox", "0 0 " + base.width + " " + base.height);
  ov.setAttribute("width", vp.width); ov.setAttribute("height", vp.height);
  drawElements();
  updateUI();
}

/* ===== Navigazione e zoom ===== */
function goPage(n) {
  n = Math.min(Math.max(1, Math.round(n) || 1), S.numPages);
  if (!S.pdf || n === S.page) { $("pageNum").value = S.page; return; }
  S.page = n; $("work").scrollTop = 0;
  render().catch(e => toast("Errore nel disegno della pagina: " + e.message, true));
  updateUI();
}
function setZoom(z) {
  if (!S.pdf) return;
  S.zoom = Math.min(MAX_Z, Math.max(MIN_Z, z));
  render().catch(e => toast("Errore nel disegno della pagina: " + e.message, true));
  updateUI();
}
async function fitWidth(doRender = true) {
  if (!S.pdf) return;
  const info = await pageSize(S.page);
  const avail = $("work").clientWidth - 56;
  S.zoom = Math.min(MAX_Z, Math.max(MIN_Z, avail / info.w));
  if (doRender) await render();
}

/* ===== Interfaccia ===== */
function updateUI() {
  const has = !!S.pdf;
  renderLegend(); $("btnSave").disabled = !has; $("btnPages").disabled = !has; $("btnRot").disabled = !has;
  $("btnUndo").disabled = !S.hist.length; $("btnRedo").disabled = !S.fut.length;
  $("docName").textContent = has ? S.name + (S.dirty ? " •" : "") : "Nessun documento aperto";
  $("pageNum").disabled = !has; $("pageNum").value = S.page; $("pageNum").max = S.numPages;
  $("pageTot").textContent = has ? "/ " + S.numPages : "/ –";
  $("prev").disabled = !has || S.page <= 1;
  $("next").disabled = !has || S.page >= S.numPages;
  $("zOut").disabled = !has || S.zoom <= MIN_Z;
  $("zIn").disabled = !has || S.zoom >= MAX_Z;
  $("zFit").disabled = !has;
  $("zVal").textContent = Math.round(S.zoom * 100) + "%";
  const st = $("status"); st.replaceChildren();
  const add = (k, v) => { const sp = document.createElement("span"), b = document.createElement("b"); sp.append(k + " "); b.textContent = v; sp.appendChild(b); st.appendChild(sp); };
  if (!has) { add("Stato:", "nessun PDF aperto"); return; }
  const ps = S.pageInfo[pkey(S.pages[S.page - 1] || {})], mm = v => Math.round(v * 25.4 / 72);
  add("File:", S.name); add("Pagina:", S.page + " di " + S.numPages);
  if (ps) { add("Formato:", mm(ps.w) + " × " + mm(ps.h) + " mm (" + (ps.w > ps.h ? "orizzontale" : "verticale") + ")"); add("Rotazione:", ps.rot + "°"); }
  add("Elementi:", S.elements.length + " (" + S.elements.filter(e => e.page === S.page).length + " in questa pagina)");
}

$("btnOpen").onclick = $("btnOpen2").onclick = () => $("file").click();
$("file").onchange = async e => {   // più file scelti insieme: il primo si apre, gli altri si uniscono in coda
  const fs = [...e.target.files]; e.target.value = ""; if (!fs.length) return;
  await openFile(fs[0]); if (fs.length > 1 && S.name === fs[0].name) addPdfs(fs.slice(1));
};
$("prev").onclick = () => goPage(S.page - 1);
$("next").onclick = () => goPage(S.page + 1);
$("pageNum").onchange = e => goPage(parseInt(e.target.value, 10));
$("zIn").onclick = () => setZoom(S.zoom * 1.2);
$("zOut").onclick = () => setZoom(S.zoom / 1.2);
$("zFit").onclick = () => fitWidth().then(updateUI).catch(e => toast(e.message, true));
$("btnPanel").onclick = () => { S.panelOpen = !S.panelOpen; $("panel").classList.toggle("closed", !S.panelOpen); $("app").classList.toggle("nopanel", !S.panelOpen); positionPanel(true); };

/* Trascinamento di file: tutta la finestra si illumina e mostra cosa succederà al rilascio */
const veil = $("veil"), zonesBox = $("zones"); let dragDepth = 0, veilTimer = 0;
const IC = { doc: '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>', plus: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>', img: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.7"/><path d="m21 16-5-5-9 9"/></svg>' };
const isPdfFile = f => /\.pdf$/i.test(f.name) || f.type === "application/pdf";
const isImgFile = f => /\.(png|jpe?g)$/i.test(f.name) || /^image\/(png|jpeg)$/.test(f.type);
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
function showVeil(types) {

}
function paintSel() {
  [...$("thumbs").children].forEach((t, i) => { const on = pgSel.includes(i + 1); t.classList.toggle("sel", on); t.setAttribute("aria-selected", on); });
  renderInfo();
}
function renderInfo() {
  const risk = S.sources.some(x => x.hasForm) && !isPlain(), box = $("dlgInfo"); box.replaceChildren();
  const t = document.createElement("span");
  t.textContent = S.pages.length + (S.pages.length === 1 ? " pagina" : " pagine") + (S.sources.length > 1 ? " da " + S.sources.length + " file" : "") + " · " + pgSel.length + " selezionat" + (pgSel.length === 1 ? "a" : "e") +
    ". Clic per selezionare (Ctrl o Maiusc per più pagine), trascina per riordinare, doppio clic per aprire la pagina.";
  box.appendChild(t);
  if (risk) { const w = document.createElement("div"); w.innerHTML = "<b>Attenzione:</b> questo PDF contiene campi compilabili che erano già presenti. Dopo eliminazioni, riordino o unioni, nel file salvato potrebbero non essere più compilabili."; box.appendChild(w); }
}
function renderThumbs() {
  const dlg = $("dlg"); if (dlg.hidden) return;
  const box = $("thumbs"), job = ++thumbJob; box.replaceChildren(); let drop = null;
  const clear = () => box.querySelectorAll(".db,.da").forEach(x => x.classList.remove("db", "da"));
  S.pages.forEach((pg, i) => {
    const n = i + 1, t = document.createElement("div"), im = new Image(), lab = document.createElement("div"), cnt = S.elements.filter(e => e.page === n).length;
    t.className = "tile" + (pgSel.includes(n) ? " sel" : "") + (n === S.page ? " cur" : ""); t.draggable = true; t.tabIndex = 0; t.setAttribute("role", "option"); t.setAttribute("aria-selected", pgSel.includes(n));
    im.alt = "Anteprima della pagina " + n; im.draggable = false; if (S.thumbs[pkey(pg)]) im.src = S.thumbs[pkey(pg)];
    lab.className = "lab"; lab.textContent = "Pagina " + n + (pg.src ? " (" + S.sources[pg.src].name + ")" : ""); t.append(im, lab);
    if (cnt) { const b = document.createElement("span"); b.className = "bd"; b.textContent = cnt + (cnt === 1 ? " elemento" : " elementi"); t.appendChild(b); }
    t.onclick = ev => {
      if (ev.shiftKey) { const a = Math.min(pgAnchor, n), z = Math.max(pgAnchor, n); pgSel = Array.from({ length: z - a + 1 }, (_, k) => a + k); }
      else if (ev.ctrlKey || ev.metaKey) { pgSel = pgSel.includes(n) ? pgSel.filter(x => x !== n) : [...pgSel, n].sort((x, y) => x - y); pgAnchor = n; }
      else { pgSel = [n]; pgAnchor = n; }
      paintSel();
    };
    t.ondblclick = () => { closePages(); goPage(n); };
    t.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); t.onclick(ev); } };
    t.ondragstart = ev => { if (!pgSel.includes(n)) { pgSel = [n]; pgAnchor = n; paintSel(); } ev.dataTransfer.setData("text/plain", "pagine"); ev.dataTransfer.effectAllowed = "move"; };
    t.ondragover = ev => { ev.preventDefault(); const r = t.getBoundingClientRect(), after = ev.clientX > r.left + r.width / 2; clear(); t.classList.add(after ? "da" : "db"); drop = { n, after }; };
    t.ondrop = ev => { ev.preventDefault(); clear(); if (drop) dropMove(drop.n, drop.after); drop = null; };
    t.ondragend = clear;
    box.appendChild(t);
  });
  renderInfo();
  (async () => {   // le anteprime si disegnano una alla volta, senza bloccare la finestra
    for (const [i, pg] of S.pages.entries()) {
      if (job !== thumbJob) return;
      try { const url = await thumbFor(pg), im = box.children[i] && box.children[i].querySelector("img"); if (im && job === thumbJob) im.src = url; } catch (e) { console.warn("Anteprima non disponibile", e); }
    }
  })();
}
function openPages() {
  if (!S.pdf) return; if (S.editing) endEdit();
  pgSel = [S.page]; pgAnchor = S.page; $("dlg").hidden = false; renderThumbs(); $("dlgClose").focus();
}
function closePages() { if ($("dlg").hidden) return; $("dlg").hidden = true; thumbJob++; $("btnPages").focus(); }
$("btnPages").onclick = openPages; $("dlgClose").onclick = closePages;
$("dlg").addEventListener("mousedown", ev => { if (ev.target === $("dlg")) closePages(); });
$("pgAdd").onclick = () => $("addFile").click();
$("addFile").onchange = ev => { const fs = [...ev.target.files]; ev.target.value = ""; if (fs.length) addPdfs(fs); };
$("pgLeft").onclick = () => moveSel(-1); $("pgRight").onclick = () => moveSel(1); $("pgDel").onclick = pagesDelete;
$("pgAll").onclick = () => { pgSel = S.pages.map((_, i) => i + 1); paintSel(); };
$("pgUndo").onclick = undo; $("pgRedo").onclick = redo;
$("pgExtract").onclick = () => pagesExtract(false); $("pgSplit").onclick = () => pagesExtract(true);
$("dlg").addEventListener("keydown", ev => {
  const inp = /INPUT|TEXTAREA/.test(ev.target.tagName || "");
  if (ev.key === "Escape") { ev.preventDefault(); closePages(); }
  else if (!inp && (ev.key === "Delete" || ev.key === "Backspace")) { ev.preventDefault(); pagesDelete(); }
  else if (!inp && (ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "a") { ev.preventDefault(); $("pgAll").click(); }
  else if (!inp && (ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z") { ev.preventDefault(); ev.shiftKey ? redo() : undo(); }
  ev.stopPropagation();
});

/* ===== Pannello a sinistra e rotazione delle pagine ===== */
function pkey(pg) { return pg.id + ":" + (pg.rot || 0); }
let lastTabTool = null;
function positionPanel(force) {   // la freccia del pannello punta all'icona dello strumento selezionato
  const b = document.querySelector(".tool.on"), p = $("panel"); if (!b || p.classList.contains("closed")) return;
  const br = b.getBoundingClientRect(), pr = p.getBoundingClientRect();
  $("app").style.setProperty("--tab-y", Math.round(br.top + br.height / 2 - pr.top) + "px");
  if (force === true || S.tool !== lastTabTool) { p.classList.remove("emerge"); void p.offsetWidth; p.classList.add("emerge"); }
  lastTabTool = S.tool;
}
window.addEventListener("resize", positionPanel);
async function rotatePages(idxs) {   // ruota di 90° in senso orario le pagine indicate, insieme ai loro elementi
  if (!S.pdf) return; if (!idxs.length) { toast("Seleziona prima le pagine da ruotare.", true); return; }
  if (S.editing) endEdit();
  const sizes = {}; for (const i of idxs) sizes[i] = await pageSize(i);   // dimensioni attuali, rotazione inclusa
  const pre = snap(), set = new Set(idxs);
  S.pages = S.pages.map((p, k) => set.has(k + 1) ? { ...p, rot: ((p.rot || 0) + 90) % 360 } : p);
  S.elements.forEach(e => {
    if (!set.has(e.page)) return;
    const H = sizes[e.page].h, cx = e.x + e.w / 2, cy = e.y + e.h / 2;   // il centro ruota con la pagina: (x, y) diventa (H − y, x)
    e.x = Math.round(H - cy - e.w / 2); e.y = Math.round(cx - e.h / 2); e.rot = ((e.rot || 0) + 90) % 360;
  });
  S.sel = null; commit(pre); S.dirty = true;
  render().catch(err => toast("Errore nel disegno della pagina: " + err.message, true)); refresh(); renderThumbs();
}
$("btnRot").onclick = () => rotatePages([S.page]);
$("pgRot").onclick = () => rotatePages(pgSel);
positionPanel();

setTool("select");
</script>
</body>
</html>
